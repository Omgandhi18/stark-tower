[package]
name = "stark-tower"
version = "0.1.0"
description = "Stark Tower — multi-agent orchestration for Claude Code, Iron Man style"
authors = ["Om Gandhi"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin on Windows.
name = "stark_tower_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Keep-awake: IOKit power assertions take CFString names.
core-foundation = "0.10"
