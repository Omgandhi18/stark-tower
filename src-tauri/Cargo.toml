[package]
name = "stark-tower"
version = "0.1.0"
description = "Stark Tower — multi-agent orchestration for Claude Code, Iron Man style"
authors = ["Om Gandhi"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin on Windows.
name = "stark_tower_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" is Tauri's multi-webview support: the built-in browser is a second webview in the window.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
chrono = "0.4"
# Chat attachments: pasted files arrive as base64; replies are scanned for files the agent made.
base64 = "0.22"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Keep-awake: IOKit power assertions take CFString names.
core-foundation = "0.10"
# Screenshots of the built-in browser (WebKit draws the page; AppKit makes it a JPEG).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSValue", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSView", "NSResponder", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"
