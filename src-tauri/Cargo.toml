[package]
name = "stark-tower"
version = "0.1.0"
description = "Stark Tower — multi-agent orchestration for Claude Code, Iron Man style"
authors = ["Om Gandhi"]
edition = "2021"
default-run = "Starkline"

# The program is called Starkline, so the Dock names it that in dev mode too
# (a built app is named by productName).
[[bin]]
name = "Starkline"
path = "src/main.rs"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin on Windows.
name = "stark_tower_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" is Tauri's multi-webview support: the built-in browser is a second webview in the window.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
chrono = "0.4"
# Chat attachments: pasted files arrive as base64; replies are scanned for files the agent made.
base64 = "0.22"
regex = "1"
# Character Studio frames and sizes generated portraits locally.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Agent voices: Kokoro speech through sherpa-onnx, run on this Mac.
sherpa-onnx = "=1.13.8"
# The model download streams to disk and is checked before extraction.
sha2 = "0.10"
# The crash log names the functions in macOS's crash reports (Rust symbols arrive mangled).
rustc-demangle = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Keep-awake: IOKit power assertions take CFString names.
core-foundation = "0.10"
# Screenshots of the built-in browser (WebKit draws the page; AppKit makes it a JPEG).
# "exception" lets AppKit errors during an event be caught before they reach tao (event_guard.rs).
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSString", "NSData", "NSDictionary", "NSError", "NSValue", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSView", "NSResponder", "NSGraphics", "NSWindow", "NSColor"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"
# Bundled Mac notifications use UserNotifications, including foreground banners and clicks.
objc2-user-notifications = { version = "0.3", features = ["block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
